#═══════════════════════════════════════════════════════════
#  Delta Stars — بناء iOS (IPA غير موقّع) → GitHub Release
#
#  ⚠️ ملاحظة: الـ IPA الناتج غير موقّع (Unsigned / Sideload):
#     - يمكن تثبيته مباشرة عبر AltStore أو Sideloadly
#     - أو إعادة توقيعه من Xcode بتوقيع Apple الرسمي لرفعه على App Store
#
#  ملاحظة تقنية: المشروع يستخدم Capacitor وSPM، ولا يحتاج pod install.
#  مجلد ios/ غير موجود في المستودع — يُنشأ تلقائياً عبر `npx cap add ios`
#═══════════════════════════════════════════════════════════
name: 🍎 Build iOS (IPA)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: بناء تطبيق iOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🟢 Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📦 Install dependencies (native binaries for macOS ARM)
        run: |
          pnpm install --frozen-lockfile
          # ضمان وجود الباينري الأصلي لـ darwin-arm64
          pnpm add --no-save @rollup/rollup-darwin-arm64 @esbuild/darwin-arm64 2>/dev/null || true

      - name: 🏗️ Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
          VITE_MAPS_KEY: ${{ secrets.VITE_MAPS_KEY }}
          VITE_MOYASAR_PUBLISHABLE_KEY: ${{ secrets.VITE_MOYASAR_PUBLISHABLE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: pnpm build:netlify

      - name: 📲 Capacitor sync (iOS)
        run: |
          npx cap add ios || echo "ios platform exists"
          npx cap sync ios
          npx cap copy ios

      - name: 🔨 Archive (بدون توقيع)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/DeltaStars.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 تجهيز ملف IPA
        run: |
          APP_PATH=/tmp/DeltaStars.xcarchive/Products/Applications/App.app
          ls -la "$APP_PATH" || { echo "❌ App.app غير موجود في الأرشيف"; exit 1; }
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload DeltaStars-unsigned.ipa || zip -r DeltaStars-unsigned.ipa Payload
          ls -lh DeltaStars-unsigned.ipa

      - name: 🏷️ تسمية الملفات + المجاميع
        run: |
          mkdir -p output
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle || node -p "require('./package.json').version")
          cp /tmp/ipa/DeltaStars-unsigned.ipa "output/DeltaStars-v${VER}-ios-unsigned.ipa"
          cd output && shasum -a 256 *.ipa > SHA256SUMS-ios.txt && cat SHA256SUMS-ios.txt

      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaStars-iOS-IPA
          path: output/*.ipa
          retention-days: 90

      - name: 📤 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.ipa
            output/SHA256SUMS-ios.txt
          fail_on_unmatched_files: false
        continue-on-error: true
