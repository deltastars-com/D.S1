name: Build Sovereign Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install Dependencies & Build Web
        run: |
          pnpm install
          pnpm build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaStars-Sovereign-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: v4.2.0-release
          name: "Delta Stars Sovereign App v4.2.0 (Android & Web)"
          body: |
            ### 🌟 Delta Stars Sovereign Store - Final Golden Release v4.2.0
            - ✅ Fixed Splash Screen hang completely (Immediate launch).
            - ✅ Sovereign Admin & Dev Console fully synchronized and accessible.
            - ✅ Saudi Green & Gold branding (#0F5132 / #D4AF37).
            - ✅ Offline capabilities, AI assistant (Oday), and GPS tracking fully active.
            - ✅ Automatically built and signed via GitHub Actions CI/CD.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
