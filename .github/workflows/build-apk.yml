name: Delta Stars Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - "android/**"
      - "shared/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "capacitor.config.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: delta-stars-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run tests and typecheck
        run: |
          pnpm test
          pnpm run typecheck

      - name: Build web assets
        run: pnpm build

      - name: Sync the current web build into Android assets
        run: pnpm exec cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Publish debug APK asset on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  production-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEY: ${{ secrets.DELTA_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check for release signing secrets
        id: signing
        shell: bash
        run: |
          if [ -n "$HAS_RELEASE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are not configured; the verified debug artifact remains available."
          fi

      - name: Set up Java 21
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode signing keystore
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DELTA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/delta-production-key.jks

      - name: Install Gradle wrapper dependencies
        if: steps.signing.outputs.available == 'true'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon help

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          DELTA_KEYSTORE_FILE: delta-production-key.jks
          DELTA_KEYSTORE_PASSWORD: ${{ secrets.DELTA_KEYSTORE_PASSWORD }}
          DELTA_KEY_ALIAS: ${{ secrets.DELTA_KEY_ALIAS }}
          DELTA_KEY_PASSWORD: ${{ secrets.DELTA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Publish signed APK
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        run: rm -f android/delta-production-key.jks
